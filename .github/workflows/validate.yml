name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n build.sh
          bash -n scripts/install-sunxi-boot.sh
          bash -n scripts/install-virt-boot.sh
          bash -n scripts/install-raspi-boot.sh
          bash -n scripts/build-armv6-kernel.sh
          bash -n scripts/extract-resource-baseline.sh
          bash -n scripts/extract-service-audit.sh
          bash -n scripts/check-resource-budget.sh
          bash -n scripts/qemu-smoke.sh

  board-preflight:
    name: Board preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [orangepi-zero-lts, orangepi-pc, virt-armhf, virt-arm64, raspi0, raspi2b, raspi3b-armhf, raspi3b-arm64]
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh "${{ matrix.board }}" --check-only

  metadata-consistency:
    name: Board metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          ids=()
          for board in boards/*.conf; do
            source "$board"
            [[ -n "${BOARD_ID:-}" && -n "${DEBIAN_ARCH:-}" && -n "${DTB:-}" && -n "${SUPPORT_TIER:-}" ]]
            ids+=("$BOARD_ID")
            if [[ "$SUPPORT_TIER" == "emulated" ]]; then
              [[ "${EMULATOR:-}" == "qemu" && -n "${QEMU_MACHINE:-}" ]]
            fi
            unset BOARD_ID BOARD_NAME ARCH DEBIAN_ARCH SOC_FAMILY SOC BOOTLOADER UBOOT_DEFCONFIG DTB KERNEL_FAMILY SERIAL_CONSOLE ROOTFS_TYPE EMULATOR QEMU_MACHINE SUPPORT_TIER
          done
          duplicates=$(printf '%s\n' "${ids[@]}" | sort | uniq -d)
          [[ -z "$duplicates" ]] || { echo "Duplicate BOARD_ID: $duplicates"; exit 1; }

  qemu-orangepi-pc:
    name: QEMU Orange Pi PC boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install builder and emulator dependencies
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap fdisk rsync qemu-system-arm qemu-user-static binfmt-support debian-archive-keyring
      - name: Build bootable LeanPi image
        run: sudo env IMAGE_SIZE_MB=1024 bash ./build.sh orangepi-pc
      - name: Verify QEMU Orange Pi machine exists
        run: qemu-system-arm -machine help | grep -F orangepi-pc
      - name: Inspect built image
        run: |
          ls -lh out/orangepi-pc/leanpi-orangepi-pc.img
          sudo sfdisk --dump out/orangepi-pc/leanpi-orangepi-pc.img
          sudo file out/orangepi-pc/leanpi-orangepi-pc.img
      - name: Boot and qualify in QEMU
        id: qemu_boot
        run: |
          sudo chown -R "$USER":"$USER" out/orangepi-pc
          bash scripts/qemu-smoke.sh orangepi-pc out/orangepi-pc/leanpi-orangepi-pc.img 420
      - name: Extract resource baseline
        if: success()
        run: bash scripts/extract-resource-baseline.sh "out/orangepi-pc/qemu-serial.log" "out/orangepi-pc/resource-baseline.txt"
      - name: Extract service audit
        if: success()
        run: bash scripts/extract-service-audit.sh "out/${{ matrix.board }}/qemu-serial.log" "out/orangepi-pc/service-audit.txt"
      - name: Enforce resource budget
        if: success()
        run: bash scripts/check-resource-budget.sh "out/${{ matrix.board }}/resource-baseline.txt"
      - name: Record qualification PASS
        if: success()
        run: echo "QEMU_BOARD_PASS=orangepi-pc-armhf" | tee out/orangepi-pc/PASS
      - name: Write qualification metadata
        if: always()
        shell: bash
        run: |
          mkdir -p out/orangepi-pc
          {
            echo "board=orangepi-pc"
            echo "architecture=armhf"
            echo "qemu_machine=orangepi-pc"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            qemu-system-arm --version | head -n 1 | sed 's/^/qemu_version=/'
            sha256sum out/orangepi-pc/leanpi-orangepi-pc.img 2>/dev/null | sed 's/^/image_sha256=/' || true
          } > out/orangepi-pc/qualification.txt
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangepi-pc-qemu-qualification
          path: |
            out/orangepi-pc/qemu-serial.log
            out/orangepi-pc/qualification.txt
            out/orangepi-pc/PASS
            out/orangepi-pc/*.sha256
          if-no-files-found: ignore


  qemu-virt:
    name: QEMU virt ${{ matrix.arch }} boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armhf
            board: virt-armhf
            qemu: qemu-system-arm
          - arch: arm64
            board: virt-arm64
            qemu: qemu-system-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install builder and emulator dependencies
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap fdisk rsync qemu-system-arm qemu-system-aarch64 qemu-user-static binfmt-support debian-archive-keyring
      - name: Build LeanPi virt image
        run: sudo env IMAGE_SIZE_MB=1024 bash ./build.sh "${{ matrix.board }}"
      - name: Boot and qualify in QEMU
        run: |
          sudo chown -R "$USER":"$USER" "out/${{ matrix.board }}"
          bash scripts/qemu-smoke.sh "${{ matrix.board }}" "out/${{ matrix.board }}/leanpi-${{ matrix.board }}.img" 180
      - name: Extract resource baseline
        if: success()
        run: bash scripts/extract-resource-baseline.sh "out/${{ matrix.board }}/qemu-serial.log" "out/${{ matrix.board }}/resource-baseline.txt"
      - name: Extract service audit
        if: success()
        run: bash scripts/extract-service-audit.sh "out/${{ matrix.board }}/qemu-serial.log" "out/${{ matrix.board }}/service-audit.txt"
      - name: Enforce resource budget
        if: success()
        run: bash scripts/check-resource-budget.sh "out/${{ matrix.board }}/resource-baseline.txt"
      - name: Record qualification PASS
        if: success()
        run: echo "QEMU_VIRT_PASS=${{ matrix.board }}" | tee "out/${{ matrix.board }}/PASS"
      - name: Write qualification metadata
        if: always()
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.board }}"
          {
            echo "board=${{ matrix.board }}"
            echo "architecture=${{ matrix.arch }}"
            echo "qemu_machine=virt"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            ${{ matrix.qemu }} --version | head -n 1 | sed 's/^/qemu_version=/'
            sha256sum "out/${{ matrix.board }}/leanpi-${{ matrix.board }}.img" 2>/dev/null | sed 's/^/image_sha256=/' || true
          } > "out/${{ matrix.board }}/qualification.txt"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-qemu-qualification
          path: |
            out/${{ matrix.board }}/qemu-serial.log
            out/${{ matrix.board }}/qualification.txt
            out/${{ matrix.board }}/resource-baseline.txt
            out/${{ matrix.board }}/service-audit.txt
            out/${{ matrix.board }}/PASS
            out/${{ matrix.board }}/*.sha256
          if-no-files-found: ignore



  qemu-raspi3b:
    name: QEMU Raspberry Pi 3 ${{ matrix.arch }} boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armhf
            board: raspi3b-armhf
            qemu: qemu-system-aarch64
          - arch: arm64
            board: raspi3b-arm64
            qemu: qemu-system-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install builder and emulator dependencies
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap fdisk rsync qemu-system-arm qemu-system-aarch64 qemu-user-static binfmt-support debian-archive-keyring
      - name: Verify QEMU Raspberry Pi 3 machine exists
        run: ${{ matrix.qemu }} -machine help | grep -F raspi3b
      - name: Build LeanPi Raspberry Pi 3 image
        run: sudo env IMAGE_SIZE_MB=1024 bash ./build.sh "${{ matrix.board }}"
      - name: Boot and qualify in QEMU
        run: |
          sudo chown -R "$USER":"$USER" "out/${{ matrix.board }}"
          bash scripts/qemu-smoke.sh "${{ matrix.board }}" "out/${{ matrix.board }}/leanpi-${{ matrix.board }}.img" 240
      - name: Extract resource baseline
        if: success()
        run: bash scripts/extract-resource-baseline.sh "out/${{ matrix.board }}/qemu-serial.log" "out/${{ matrix.board }}/resource-baseline.txt"
      - name: Extract service audit
        if: success()
        run: bash scripts/extract-service-audit.sh "out/${{ matrix.board }}/qemu-serial.log" "out/${{ matrix.board }}/service-audit.txt"
      - name: Enforce resource budget
        if: success()
        run: bash scripts/check-resource-budget.sh "out/${{ matrix.board }}/resource-baseline.txt"
      - name: Record qualification PASS
        if: success()
        run: echo "QEMU_BOARD_PASS=${{ matrix.board }}" | tee "out/${{ matrix.board }}/PASS"
      - name: Write qualification metadata
        if: always()
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.board }}"
          {
            echo "board=${{ matrix.board }}"
            echo "architecture=${{ matrix.arch }}"
            echo "qemu_machine=raspi3b"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            ${{ matrix.qemu }} --version | head -n 1 | sed 's/^/qemu_version=/'
            sha256sum "out/${{ matrix.board }}/leanpi-${{ matrix.board }}.img" 2>/dev/null | sed 's/^/image_sha256=/' || true
          } > "out/${{ matrix.board }}/qualification.txt"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-qemu-qualification
          path: |
            out/${{ matrix.board }}/qemu-serial.log
            out/${{ matrix.board }}/qualification.txt
            out/${{ matrix.board }}/resource-baseline.txt
            out/${{ matrix.board }}/service-audit.txt
            out/${{ matrix.board }}/PASS
            out/${{ matrix.board }}/*.sha256
          if-no-files-found: ignore


  qemu-raspi2b:
    name: QEMU Raspberry Pi 2 armhf boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install builder and emulator dependencies
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap fdisk rsync qemu-system-arm qemu-user-static binfmt-support debian-archive-keyring
      - name: Verify QEMU Raspberry Pi 2 machine exists
        run: qemu-system-arm -machine help | grep -F raspi2b
      - name: Build LeanPi Raspberry Pi 2 image
        run: sudo env IMAGE_SIZE_MB=1024 bash ./build.sh raspi2b
      - name: Boot and qualify in QEMU
        run: |
          sudo chown -R "$USER":"$USER" out/raspi2b
          bash scripts/qemu-smoke.sh raspi2b out/raspi2b/leanpi-raspi2b.img 240
      - name: Extract resource baseline
        if: success()
        run: bash scripts/extract-resource-baseline.sh "out/raspi2b/qemu-serial.log" "out/raspi2b/resource-baseline.txt"
      - name: Extract service audit
        if: success()
        run: bash scripts/extract-service-audit.sh "out/raspi2b/qemu-serial.log" "out/raspi2b/service-audit.txt"
      - name: Enforce resource budget
        if: success()
        run: bash scripts/check-resource-budget.sh "out/raspi2b/resource-baseline.txt"
      - name: Record qualification PASS
        if: success()
        run: echo "QEMU_BOARD_PASS=raspi2b-armhf" | tee out/raspi2b/PASS
      - name: Write qualification metadata
        if: always()
        shell: bash
        run: |
          mkdir -p out/raspi2b
          {
            echo "board=raspi2b"
            echo "architecture=armhf"
            echo "qemu_machine=raspi2b"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            qemu-system-arm --version | head -n 1 | sed 's/^/qemu_version=/'
            sha256sum out/raspi2b/leanpi-raspi2b.img 2>/dev/null | sed 's/^/image_sha256=/' || true
          } > out/raspi2b/qualification.txt
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raspi2b-qemu-qualification
          path: |
            out/raspi2b/qemu-serial.log
            out/raspi2b/qualification.txt
            out/raspi2b/PASS
            out/raspi2b/*.sha256
          if-no-files-found: ignore


  kernel-armv6:
    name: Build Raspberry Pi Zero ARMv6 kernel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM cross toolchain
        run: sudo apt-get update && sudo apt-get install -y git make gcc-arm-linux-gnueabihf bc bison flex libssl-dev libelf-dev
      - name: Cache ARMv6 kernel build
        uses: actions/cache@v4
        with:
          path: out/kernel-armv6
          key: leanpi-armv6-kernel-${{ runner.os }}-${{ hashFiles('scripts/build-armv6-kernel.sh') }}
      - name: Build ARMv6 kernel
        run: |
          if [[ ! -f out/kernel-armv6/boot/kernel.img ]]; then
            bash scripts/build-armv6-kernel.sh out/kernel-armv6
          fi
      - name: Verify ARMv6 kernel artifacts
        run: |
          test -s out/kernel-armv6/boot/kernel.img
          test -s out/kernel-armv6/boot/bcm2835-rpi-zero.dtb
          test -s out/kernel-armv6/BUILDINFO
          cat out/kernel-armv6/BUILDINFO
      - name: Upload ARMv6 kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: leanpi-armv6-kernel
          path: out/kernel-armv6
          if-no-files-found: error


  qemu-raspi0:
    name: QEMU Raspberry Pi Zero ARMv6 boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: kernel-armv6
    steps:
      - uses: actions/checkout@v4
      - name: Install builder and emulator dependencies
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap fdisk rsync qemu-system-arm qemu-user-static binfmt-support debian-archive-keyring
      - name: Download ARMv6 kernel
        uses: actions/download-artifact@v4
        with:
          name: leanpi-armv6-kernel
          path: out/kernel-armv6
      - name: Verify QEMU Raspberry Pi Zero machine exists
        run: qemu-system-arm -machine help | grep -F raspi0
      - name: Build LeanPi Raspberry Pi Zero image
        run: sudo env IMAGE_SIZE_MB=1024 ARMV6_KERNEL_DIR=out/kernel-armv6 bash ./build.sh raspi0
      - name: Boot and qualify in QEMU
        run: |
          sudo chown -R "$USER":"$USER" out/raspi0
          bash scripts/qemu-smoke.sh raspi0 out/raspi0/leanpi-raspi0.img 300
      - name: Extract resource baseline
        if: success()
        run: bash scripts/extract-resource-baseline.sh "out/${{ matrix.board }}/qemu-serial.log" "out/${{ matrix.board }}/resource-baseline.txt"
      - name: Extract service audit
        if: success()
        run: bash scripts/extract-service-audit.sh "out/${{ matrix.board }}/qemu-serial.log" "out/${{ matrix.board }}/service-audit.txt"
      - name: Enforce resource budget
        if: success()
        run: bash scripts/check-resource-budget.sh "out/${{ matrix.board }}/resource-baseline.txt"
      - name: Record qualification PASS
        if: success()
        run: echo "QEMU_BOARD_PASS=raspi0-armv6" | tee out/raspi0/PASS
      - name: Write qualification metadata
        if: always()
        run: |
          mkdir -p out/raspi0
          {
            echo "board=raspi0"
            echo "architecture=armel-armv6"
            echo "qemu_machine=raspi0"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            qemu-system-arm --version | head -n 1 | sed 's/^/qemu_version=/'
            sha256sum out/raspi0/leanpi-raspi0.img 2>/dev/null | sed 's/^/image_sha256=/' || true
          } > out/raspi0/qualification.txt
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raspi0-qemu-qualification
          path: |
            out/raspi0/qemu-serial.log
            out/raspi0/qualification.txt
            out/raspi0/PASS
            out/raspi0/*.sha256
          if-no-files-found: ignore
