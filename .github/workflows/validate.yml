name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n build.sh
          bash -n scripts/install-sunxi-boot.sh
          bash -n scripts/qemu-smoke.sh

  board-preflight:
    name: Board preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [orangepi-zero-lts, orangepi-pc, raspi2b, raspi3b-armhf, raspi3b-arm64]
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh "${{ matrix.board }}" --check-only

  metadata-consistency:
    name: Board metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          ids=()
          for board in boards/*.conf; do
            source "$board"
            [[ -n "${BOARD_ID:-}" && -n "${DEBIAN_ARCH:-}" && -n "${DTB:-}" && -n "${SUPPORT_TIER:-}" ]]
            ids+=("$BOARD_ID")
            if [[ "$SUPPORT_TIER" == "emulated" ]]; then
              [[ "${EMULATOR:-}" == "qemu" && -n "${QEMU_MACHINE:-}" ]]
            fi
            unset BOARD_ID BOARD_NAME ARCH DEBIAN_ARCH SOC_FAMILY SOC BOOTLOADER UBOOT_DEFCONFIG DTB KERNEL_FAMILY SERIAL_CONSOLE ROOTFS_TYPE EMULATOR QEMU_MACHINE SUPPORT_TIER
          done
          duplicates=$(printf '%s\n' "${ids[@]}" | sort | uniq -d)
          [[ -z "$duplicates" ]] || { echo "Duplicate BOARD_ID: $duplicates"; exit 1; }

  qemu-orangepi-pc:
    name: QEMU Orange Pi PC boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install builder and emulator dependencies
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap fdisk rsync qemu-system-arm qemu-user-static binfmt-support debian-archive-keyring
      - name: Build bootable LeanPi image
        run: sudo env IMAGE_SIZE_MB=1024 bash ./build.sh orangepi-pc
      - name: Verify QEMU Orange Pi machine exists
        run: qemu-system-arm -machine help | grep -F orangepi-pc
      - name: Inspect built image
        run: |
          ls -lh out/orangepi-pc/leanpi-orangepi-pc.img
          sudo sfdisk --dump out/orangepi-pc/leanpi-orangepi-pc.img
          sudo file out/orangepi-pc/leanpi-orangepi-pc.img
      - name: Boot and qualify in QEMU
        id: qemu_boot
        run: |
          sudo chown -R "$USER":"$USER" out/orangepi-pc
          bash scripts/qemu-smoke.sh orangepi-pc out/orangepi-pc/leanpi-orangepi-pc.img 420
      - name: Record qualification PASS
        if: success()
        run: echo "QEMU_BOARD_PASS=orangepi-pc-armhf" | tee out/orangepi-pc/PASS
      - name: Write qualification metadata
        if: always()
        shell: bash
        run: |
          mkdir -p out/orangepi-pc
          {
            echo "board=orangepi-pc"
            echo "architecture=armhf"
            echo "qemu_machine=orangepi-pc"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            qemu-system-arm --version | head -n 1 | sed 's/^/qemu_version=/'
            sha256sum out/orangepi-pc/leanpi-orangepi-pc.img 2>/dev/null | sed 's/^/image_sha256=/' || true
          } > out/orangepi-pc/qualification.txt
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangepi-pc-qemu-qualification
          path: |
            out/orangepi-pc/qemu-serial.log
            out/orangepi-pc/qualification.txt
            out/orangepi-pc/PASS
            out/orangepi-pc/*.sha256
          if-no-files-found: ignore
